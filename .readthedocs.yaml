version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
   configuration: docs/conf.py

# autodoc imports geotessera, so the package itself has to be installed.
# The `docs` extra carries Sphinx; runtime installs no longer pull it in.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
